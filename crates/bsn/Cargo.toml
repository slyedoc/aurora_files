# `bsn` — the general aurora `.bsn` scene viewer. Loads any baked `.bsn` under hardware ray
# tracing and flies a free camera through it. Install once (`cargo install --path crates/bsn`)
# and run from any repo with an assets/ dir: `bsn assets/lunarbase/KB3D_LNB_Lamp_A.bsn`.
[package]
name = "bsn"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bsn"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_camera_controller", "free_camera"] }
bevy_aurora = { workspace = true, features = ["dev"] }
clap.workspace = true
util = { path = "../util" }
