# General bevy_aurora `.bsn` scene viewer. Loads any importer-baked `.bsn` under full ray tracing
# and flies a free camera through it — point it at an asset-relative `.bsn` path from this tree:
#
#   cargo run --release -p aurora_view -- bistro/bistro.bsn
[package]
name = "aurora_view"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "aurora_view"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_camera_controller", "free_camera"] }
bevy_aurora.workspace = true
clap.workspace = true
util = { path = "../util" }
