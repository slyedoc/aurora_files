# Core of the importer pipeline: OBJ/MTL -> `bevy_aurora` `.cluster_mesh` assets + a `.bsn` scene.
# Owns the OMM CPU-baker link (build.rs + csrc) and depends on the bevy fork; the per-asset
# importer binaries are thin wrappers over `bake_scene`.
[package]
name = "aurora_bsn"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy.workspace = true
bevy_aurora.workspace = true
tobj = "4"
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg", "tga"] }
# glTF import path (Bistro). Same crate + extension set bevy_gltf uses, so materials/extensions
# decode identically; `import` pulls buffer loading, `utils` the mesh accessor readers.
gltf = { version = "1.4.0", default-features = false, features = [
  "import",
  "utils",
  "names",
  "extras",
  "extensions",
  "KHR_materials_transmission",
  "KHR_materials_ior",
  "KHR_materials_specular",
  "KHR_materials_volume",
  "KHR_materials_emissive_strength",
] }

# Compiles the OMM CPU-baker shim (csrc/omm_shim.cpp); links the prebuilt OMM SDK (see build.rs).
[build-dependencies]
cc = "1"
