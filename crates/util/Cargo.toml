# Shared rig for the aurora tools: the hover-park camera helper and the common log filter.
[package]
name = "util"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { workspace = true, features = [
  "bevy_camera_controller",
  "free_camera",
  "bevy_ui",
  "ui_picking",
  "bevy_mesh",
  "bevy_image",
] }
# `Extent3d` / `TextureFormat` for the grid texture: bevy re-exports neither at the root here.
wgpu-types = { version = "30", default-features = false }
