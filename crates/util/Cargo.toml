# Shared rig for the aurora tools (modeled on zero's crates/util): sun controls
# and the common log filter. What the viewer and importer load-tests would
# otherwise duplicate lives here.
[package]
name = "util"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { workspace = true, features = [
  "bevy_camera_controller",
  "free_camera",
  "bevy_ui",
  "ui_picking",
] }
bevy_aurora.workspace = true
