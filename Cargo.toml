# `.bsn` importer workspace: the `aurora_bsn` library + per-asset importer binaries and a viewer.
# Converts source OBJ/MTL or glTF into `bevy_aurora` `.cluster_mesh` assets and a `.bsn` scene,
# sidestepping glTF's lack of displacement/depth maps; the viewer renders the result on aurora.
#
# `furnace` and `grader` are PARKED (excluded): they still render on the old wgpu solari stack
# and aren't worth carrying until the rendering pass they exist to grade gets its own rework.
[workspace]
resolver = "3"
members = [
  "crates/aurora_bsn",
  "crates/make_human",
  "crates/util",
  "crates/viewer",
  "crates/xtask",
  "importers/*",
]
exclude = ["crates/furnace", "crates/grader"]

[workspace.dependencies]
# The stacked bevy branch bevy_aurora pins (render-free: no bevy_render/wgpu anywhere in this
# workspace anymore — the cluster bake and the wire-format writer live in bevy_aurora itself).
# `bevy_animation` carries the `.animclip` parser the g1 importer round-trips.
bevy = { git = "https://github.com/slyedoc/bevy.git", branch = "aurora", default-features = false, features = [
  "default_app",
  "default_platform",
  "common_api",
  "std",
  "multi_threaded",
  "transform_f64",
  "scene",
  "serialize",
  "bevy_animation",
  "bevy_camera",
  "bevy_mesh",
  "bevy_mikktspace",
  "bevy_image",
  "bevy_color",
  "png",
  "jpeg",
  "ktx2",
  "zstd_rust",
] }
# The engine: `ClusterMesh` + `write_cluster_mesh_sync` (the SACRED wire format) + the
# Mesh -> ClusterMesh bake, and everything the viewer renders with.
bevy_aurora = { path = "../bevy_aurora" }
# CLI parsing for the importer binaries.
clap = { version = "4", features = ["derive"] }

# bevy_aurora pins ash git master (NV cluster/PTLAS extensions); the patch must live at THIS
# workspace root to apply.
[patch.crates-io]
ash = { git = "https://github.com/slyedoc/ash", branch = "aurora" }
ash-window = { git = "https://github.com/slyedoc/ash", branch = "aurora" }

# make_human's manifest reaches bevy/avian/enhanced_input by their upstream
# URLs (same convention as zero); redirect them onto the one stacked graph.
