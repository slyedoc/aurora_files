# `.bsn` importer workspace: the `solari_bsn` library + per-asset importer binaries and a viewer.
# Converts source OBJ/MTL or glTF into `bevy_solari` `.cluster_mesh` assets and a `.bsn` scene,
# sidestepping glTF's lack of displacement/depth maps; `solari_view` renders the result.
[workspace]
resolver = "3"
members = ["crates/*", "importers/*"]

[workspace.dependencies]
# Umbrella with defaults so `bevy::mesh` / `bevy::asset` / `bevy::solari` re-exports exist;
# `cluster_processor` gates the `Mesh -> ClusterMesh` bake. Shared by solari_bsn and the importers.
bevy = { path = "/mnt/code/f/bevy", features = [
  "bevy_solari",
  "cluster_processor",
  # Always on: the whole stack is NVIDIA-only anyway, and recipe behavior
  # UNDER DLSS RR is what any meaningful test measures.
  "dlss",
] }
# CLI parsing for the importer binaries.
clap = { version = "4", features = ["derive"] }

# bevy_solari pulls forked wgpu/naga/ash; this workspace must mirror the bevy workspace's patch
# table (the worktree's root Cargo.toml `[patch.crates-io]`). Patches only apply at the workspace
# root, so they live here rather than in any member crate.
[patch.crates-io]
# Mirror zero's patch table: the bevy fork moved to the LOCAL wgpu fork (has COOPERATIVE_VECTOR);
# the old `solari-rt-naga` git branch predates coopvec and no longer builds bevy_solari.
wgpu             = { path = "/mnt/code/f/wgpu/wgpu" }
wgpu-core        = { path = "/mnt/code/f/wgpu/wgpu-core" }
wgpu-hal         = { path = "/mnt/code/f/wgpu/wgpu-hal" }
wgpu-types       = { path = "/mnt/code/f/wgpu/wgpu-types" }
wgpu-naga-bridge = { path = "/mnt/code/f/wgpu/wgpu-naga-bridge" }
naga             = { path = "/mnt/code/f/wgpu/naga" }
# Local naga_oil: the git `solari-ser` head (b9480dd) predates naga's CooperativeVectorStore variant;
# the local checkout (56c4302) adds the redirect arms. Matches the active coopvec work.
naga_oil         = { path = "/mnt/code/f/naga_oil" }
ash              = { git = "https://github.com/ash-rs/ash.git", branch = "master" }
gpu-allocator    = { git = "https://github.com/slyedoc/gpu-allocator.git", branch = "ash-push-rename" }
