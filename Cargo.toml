# `.bsn` importer workspace: the `solari_bsn` library + per-asset importer binaries and a viewer.
# Converts source OBJ/MTL or glTF into `bevy_solari` `.cluster_mesh` assets and a `.bsn` scene,
# sidestepping glTF's lack of displacement/depth maps; `solari_view` renders the result.
[workspace]
resolver = "3"
members = ["crates/*", "importers/*"]

[workspace.dependencies]
# Umbrella with defaults so `bevy::mesh` / `bevy::asset` / `bevy::solari` re-exports exist;
# `cluster_processor` gates the `Mesh -> ClusterMesh` bake. Shared by solari_bsn and the importers.
bevy = { path = "/mnt/code/f/bevy/.claude/worktrees/chore-research-slang", features = [
  "bevy_solari",
  "cluster_processor",
  # Always on: the whole stack is NVIDIA-only anyway, and camera behavior
  # UNDER DLSS RR is what any meaningful test measures.
  "dlss",
  # F1 world inspector in every tool.
  "experimental_bevy_feathers_inspector",
] }
# CLI parsing for the importer binaries.
clap = { version = "4", features = ["derive"] }

# bevy_solari pulls forked wgpu/naga/ash; this workspace must mirror the bevy workspace's patch
# table (the worktree's root Cargo.toml `[patch.crates-io]`). Patches only apply at the workspace
# root, so they live here rather than in any member crate.
[patch.crates-io]
# Mirror the chore-research-slang worktree's patch table: the descriptor-heap work lives on the
# wgpu-slang checkout (branch solari-slang — view/sampler create-info accessors, Sampler::as_hal,
# heap ride-along extensions), which the older /mnt/code/f/wgpu checkout lacks.
wgpu             = { path = "/mnt/code/f/wgpu-slang/wgpu" }
wgpu-core        = { path = "/mnt/code/f/wgpu-slang/wgpu-core" }
wgpu-hal         = { path = "/mnt/code/f/wgpu-slang/wgpu-hal" }
wgpu-types       = { path = "/mnt/code/f/wgpu-slang/wgpu-types" }
wgpu-naga-bridge = { path = "/mnt/code/f/wgpu-slang/wgpu-naga-bridge" }
naga             = { path = "/mnt/code/f/wgpu-slang/naga" }
# Stock naga_oil pinned at the wgpu-29 update, same as the worktree.
naga_oil         = { path = "/mnt/code/f/naga_oil-slang" }
ash              = { git = "https://github.com/ash-rs/ash.git", branch = "master" }
gpu-allocator    = { git = "https://github.com/slyedoc/gpu-allocator.git", branch = "ash-push-rename" }
