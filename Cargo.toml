# `.bsn` importer workspace: the `aurora_bsn` library + per-asset importer binaries and a viewer.
# Converts source OBJ/MTL or glTF into `.cluster_mesh` assets and a `.bsn` scene, sidestepping
# glTF's lack of displacement/depth maps; the viewer renders the result on aurora
# (https://github.com/slyedoc/aurora, crate `bevy_aurora`).
#
# PARKED (excluded): `furnace` / `grader` / `xtask` render on the old wgpu solari stack;
# `g1` needs the `.animclip` transcoder from the old engine's bevy branch; `bake_person` /
# `dressing_room` need make_human, which still path-depends on the old engine.
[workspace]
resolver = "3"
members = [
  "crates/aurora_bsn",
  "crates/util",
  "crates/bsn",
  "crates/bevy_city",
  "importers/bistro",
  "importers/hoverboard",
  "importers/kenney",
  "importers/lunarbase",
  "importers/namaqualand_boulder",
  "importers/polyhaven",
  "importers/prop",
  "importers/san_miguel",
  "importers/speedtree",
  "importers/zeroday",
]
exclude = [
  "crates/furnace",
  "crates/grader",
  "crates/xtask",
  "importers/g1",
  "importers/bake_person",
  "importers/dressing_room",
]

[workspace.dependencies]
# The bevy branch the aurora engine tracks (upstream main + render-free feathers, the .bsn
# loader, bevy_feathers_inspector). Importers only need the mesh/asset half; the viewer gets the
# renderer's own feature set unioned in through `bevy_aurora`.
bevy = { git = "https://github.com/slyedoc/bevy.git", branch = "aurora", default-features = false, features = [
  "default_app",
  "default_platform",
  "common_api",
  "std",
  "multi_threaded",
  "scene",
  "serialize",
  "bevy_camera",
  "bevy_camera_controller",
  "free_camera",
  "bevy_mesh",
  "bevy_mikktspace",
  "bevy_image",
  "bevy_color",
  "png",
  "jpeg",
  "ktx2",
  "zstd_rust",
] }
# The `.cluster_mesh` wire format + flat bake, without the renderer (importers).
aurora_cluster_mesh = { git = "https://github.com/slyedoc/aurora.git", branch = "main" }
# The engine itself (viewer only).
bevy_aurora = { git = "https://github.com/slyedoc/aurora.git", branch = "main" }
# CLI parsing for the importer binaries.
clap = { version = "4", features = ["derive"] }

[patch."https://github.com/slyedoc/aurora"]
bevy_aurora = { path = "../aurora" }

# make_human's manifest reaches bevy/avian/enhanced_input by their upstream
# URLs (same convention as zero); redirect them onto the one stacked graph.
