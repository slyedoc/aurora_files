# Namaqualand Boulder importer: bake the Poly Haven scanned-boulder glTF → `.cluster_mesh` + `.bsn`.
# A single high-detail prop (diff/arm/nor textures, no displacement map — the relief is baked into
# the mesh). Mirrors the Bistro importer; proves `solari_bsn::bake_gltf_scene` on a `.gltf` + sibling
# `.bin`/textures (vs Bistro's self-contained `.glb`).
#
#   cargo run --release -p namaqualand_boulder_import -- \
#     raw/namaqualand_boulder_02_8k/namaqualand_boulder_02_8k.gltf assets/namaqualand_boulder
[package]
name = "namaqualand_boulder_import"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "namaqualand_boulder_import"
path = "src/main.rs"

[dependencies]
solari_bsn = { path = "../../crates/solari_bsn" }
clap.workspace = true
