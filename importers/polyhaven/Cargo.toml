# Poly Haven → terrain KTX2 texture arrays (no bevy dep — pure image tooling).
[package]
name = "polyhaven"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ktx2 = "0.3"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
